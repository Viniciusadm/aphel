[package]
name = "aphel-blocks"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Structured content blocks shared by Aphel plugins, the host and the browser: schema, normalization, links, media and slugs"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
plugin = ["dep:aphel-plugin-sdk"]
web = []

[dependencies]
aphel-plugin-sdk = { path = "../aphel-plugin-sdk", optional = true }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[workspace]
