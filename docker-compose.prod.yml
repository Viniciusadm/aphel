name: aphel-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${APHEL_IMAGE:-ghcr.io/viniciusadm/aphel:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-aphel}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3001
      MYSQL_ROOT_PASSWORD: ""
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - app-storage:/app/storage
    healthcheck:
      test: ["CMD", "/usr/local/bin/aphel", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    image: ${APHEL_IMAGE:-ghcr.io/viniciusadm/aphel:latest}
    pull_policy: never
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-aphel}
      MYSQL_ROOT_PASSWORD: ""
    volumes:
      - app-storage:/app/storage
    healthcheck:
      test: ["CMD", "/usr/local/bin/aphel", "healthcheck", "--worker"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aphel}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  app-storage:
  mysql-data:
