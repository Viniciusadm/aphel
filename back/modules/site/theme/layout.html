<!doctype html>
<html lang="{{ site.locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}{% endblock %}</title>
<style>
:root{--bg:#fbfbfd;--fg:#1d1d24;--muted:#5d5d6b;--line:#e4e4ea;--accent:{{ site.color }};--link:var(--accent);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#111116;--fg:#ececf1;--muted:#a3a3b2;--line:#2a2a33;--link:color-mix(in srgb,var(--accent) 55%,#fff)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)}
.wrap{max-width:46rem;margin:0 auto;padding:0 1rem}
header.site{border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;min-height:3.5rem}
header.site a.brand{color:var(--fg);font-weight:600;text-decoration:none}
main{padding:2rem 0 3rem}
footer.site{border-top:1px solid var(--line);color:var(--muted);font-size:.875rem;padding:1.5rem 0}
h1,h2,h3{line-height:1.25}
img{max-width:100%;height:auto}
.muted{color:var(--muted)}
nav.pagination{display:flex;justify-content:space-between;margin-top:2rem}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="site"><div class="wrap"><a class="brand" href="{{ site.home }}">{{ site.name }}</a></div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
<footer class="site"><div class="wrap">© {{ site.year }} {{ site.name }}</div></footer>
</body>
</html>
