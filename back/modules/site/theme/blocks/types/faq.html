{% set questions = block['items'] | selectattr('question') | list %}
{% if questions %}<section class="blk-block blk-faq blk-width-narrow">
{% if block.title %}<h2>{{ block.title }}</h2>{% endif %}
{% for item in questions %}<details class="blk-faq-item"><summary>{{ item.question }}</summary><div class="blk-faq-answer">{{ item.answer | markdown }}</div></details>{% endfor %}
</section>{% endif %}
