{% if block.display == 'field' %}<form class="blk-search site-search-form" action="{{ site.search }}" role="search"><input type="search" name="q" minlength="2" maxlength="100" aria-label="{{ site.texts.search_label }}" placeholder="{{ site.texts.search_label }}"><button type="submit">{{ site.texts.search }}</button></form>{% else %}<a class="search-entry" href="{{ site.search }}" aria-label="{{ site.texts.search }}" title="{{ site.texts.search }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>{% endif %}
