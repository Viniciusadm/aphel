{% macro href(link, prefix) %}{{ site_path(link) }}{% endmacro %}
{% macro picture(images, id, width, alt, class_name='', eager=false, focal_x=50, focal_y=50) %}{% for image in images or [] %}{% if image.id == id %}<img class="{{ class_name }}" src="{{ image | image_url(width) }}" srcset="{{ image | image_url(640) }} 640w, {{ image | image_url(1280) }} 1280w, {{ image | image_url(1920) }} 1920w" sizes="(max-width: 48rem) 100vw, {{ width }}px" alt="{{ alt }}" width="{{ width }}" height="{{ (width * 9 / 16) | int }}" style="object-position:{{ focal_x | float }}% {{ focal_y | float }}%"{% if not eager %} loading="lazy"{% endif %} decoding="async">{% endif %}{% endfor %}{% endmacro %}
