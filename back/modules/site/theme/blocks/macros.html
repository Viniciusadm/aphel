{% macro href(link, prefix) %}{{ site_path(link) }}{% endmacro %}
{% macro picture(images, id, width, alt, class_name='', eager=false) %}{% for image in images or [] %}{% if image.id == id %}<img class="{{ class_name }}" src="{{ image | image_url(width) }}" srcset="{{ image | image_url(640) }} 640w, {{ image | image_url(1280) }} 1280w, {{ image | image_url(1920) }} 1920w" sizes="(max-width: 48rem) 100vw, {{ width }}px" alt="{{ alt }}"{% if not eager %} loading="lazy"{% endif %} decoding="async">{% endif %}{% endfor %}{% endmacro %}
