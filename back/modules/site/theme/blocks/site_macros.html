{% macro menu_items(items) %}{% for item in items %}{% if item.children %}<details class="menu-group"><summary{% if item.active %} class="active"{% endif %}>{{ item.label }}</summary><span class="submenu">{% if item.url %}<a href="{{ item.url }}"{% if item.active and not item.children | selectattr("active") | list %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endif %}{% for child in item.children %}<a href="{{ child.url }}"{% if child.active %} aria-current="page"{% endif %}>{{ child.label }}</a>{% endfor %}</span></details>{% else %}<a href="{{ item.url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endif %}{% endfor %}{% endmacro %}
