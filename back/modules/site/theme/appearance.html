{% set a = site.appearance %}{% set mode = a.styles.mode or 'system' %}
<style>
body{overflow-wrap:anywhere}
.blk-slot{scroll-margin-top:7rem}
h1,h2,h3,h4,h5,h6{text-wrap:balance}
:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:.25rem}
header.site{background:color-mix(in srgb,var(--bg) 88%,transparent);{% if a.sticky_header %}position:sticky;top:0;z-index:20;{% endif %}}
header.site .wrap{min-height:4.25rem}
.brand .dark-logo{display:none}
{% if mode == 'dark' %}.brand .light-logo{display:none}.brand .dark-logo{display:block}{% elif mode == 'system' %}@media(prefers-color-scheme:dark){.brand .light-logo{display:none}.brand .dark-logo{display:block}}{% endif %}
</style>
{% if a.icon %}<link rel="icon" href="{{ a.icon }}">{% endif %}
