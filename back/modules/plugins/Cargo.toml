deals = { package = "aphel-mod-deals", path = "../deals" }
activities = { package = "aphel-mod-activities", path = "../activities" }
currencies = { package = "aphel-mod-currencies", path = "../currencies" }
pipelines = { package = "aphel-mod-pipelines", path = "../pipelines" }
