[package]
name = "aphel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aphel"
path = "src/main.rs"

[features]
default = ["plugins"]
plugins = ["dep:module-objects", "dep:module-notifications", "dep:module-config-packages", "dep:module-search", "dep:module-saved-views", "dep:module-record-layouts", "dep:module-formulas", "dep:module-validation-rules", "dep:module-marketplace", "dep:module-people", "dep:module-organizations", "dep:module-leads", "dep:module-scoring", "dep:module-money", "dep:module-workflow", "dep:module-deals", "dep:module-line-items", "dep:module-deals-revenue", "dep:module-renewals", "dep:module-goals", "dep:module-forecast", "dep:module-tasks", "dep:module-notes", "dep:module-reminders", "dep:module-timeline", "dep:module-favorites", "dep:module-followers", "dep:module-dashboard", "dep:module-reports", "dep:module-demo", "dep:module-assignment", "dep:module-tagging", "dep:module-segments", "dep:module-telephony", "dep:module-email", "dep:module-sequences", "dep:module-booking", "dep:module-approvals", "dep:module-automations", "dep:module-webhooks", "dep:module-integrations", "dep:module-wasm-runtime", "dep:module-imports", "dep:module-exports", "dep:module-bulk-actions", "dep:module-duplicates", "dep:module-trash", "dep:module-privacy", "dep:module-org-export", "dep:module-migrations-assistant", "dep:module-catalog-items", "dep:module-pricing", "dep:module-quotes", "dep:module-proposals", "dep:module-insights", "dep:module-forms", "dep:module-ai", "dep:module-sso", "dep:module-google", "dep:module-microsoft", "dep:module-esign", "dep:module-enrichment", "dep:module-messaging", "dep:module-calendar", "dep:module-documents", "dep:module-site", "dep:module-publication", "dep:module-media"]

[dependencies]
serde.workspace = true
aphel-kernel.workspace = true
aphel-blueprint.workspace = true
axum.workspace = true
chrono.workspace = true
aphel-plugin = { path = "../../sdk/cli" }
clap.workspace = true
dotenvy.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
getrandom.workspace = true
base64.workspace = true
reqwest.workspace = true
mimalloc.workspace = true

