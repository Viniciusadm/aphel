[workspace]
resolver = "3"
members = ["kernel", "contract", "contracts/*", "sdk", "modules/*", "plugins/*", "app", "xtask"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"

[workspace.dependencies]
aphel-contract-configuration = { path = "contracts/configuration" }
aphel-contract-notifications = { path = "contracts/notifications" }
aphel-contract-email = { path = "contracts/email" }
aphel-contract-pricing = { path = "contracts/pricing" }
aphel-contract-approvals = { path = "contracts/approvals" }
aphel-contract-webhooks = { path = "contracts/webhooks" }
aphel-contract-imports = { path = "contracts/imports" }
aphel-contract-automation = { path = "contracts/automation" }
aphel-kernel = { path = "kernel" }
aphel-contract = { path = "contract" }
aphel-contract-messaging = { path = "contracts/messaging" }
aphel-contract-assignment = { path = "contracts/assignment" }
aphel-contract-documents = { path = "contracts/documents" }
aphel-contract-privacy = { path = "contracts/privacy" }
aphel-contract-timeline = { path = "contracts/timeline" }
aphel-contract-deals = { path = "contracts/deals" }
aphel-contract-line-items = { path = "contracts/line_items" }
aphel-contract-money = { path = "contracts/money" }
aphel-contract-calendar = { path = "contracts/calendar" }
aphel-contract-workflow = { path = "contracts/workflow" }
aphel-contract-party = { path = "contracts/party" }
aphel-contract-crm = { path = "contracts/crm" }
aphel-contract-tagging = { path = "contracts/tagging" }
aphel-sdk = { path = "sdk" }
semver = "1"
form_urlencoded = "1.2"
axum = { version = "0.8", features = ["multipart"] }
argon2 = "0.6"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "mysql-rsa", "migrate", "macros", "chrono", "uuid", "json", "rust_decimal"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id", "sensitive-headers", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname", "tokio1-rustls", "ring", "webpki-roots"] }
sha2 = "0.11"
getrandom = "0.4"
bytes = "1"
futures = "0.3"
object_store = { version = "0.14", features = ["aws"] }
cron = "0.17"
infer = "0.22"
rust_decimal = "1"
regex = "1"
phonenumber = "0.3"
chrono-tz = "0.10"
csv = "1"
encoding_rs = "0.8"
rust_xlsxwriter = "0.100"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.13"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
libc = "0.2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
ammonia = "4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
toml = { version = "1", features = ["preserve_order"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
