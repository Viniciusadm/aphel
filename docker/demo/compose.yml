name: aphel-demo

x-aphel: &aphel
  image: aphel:latest
  pull_policy: never
  restart: unless-stopped
  env_file: ../../.env
  environment: &aphel-environment
    DATABASE_URL: mysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-aphel_demo}
    DEMO_MODE: "true"
    MYSQL_ROOT_PASSWORD: ""
  volumes:
    - demo-storage:/app/storage

services:
  app:
    <<: *aphel
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    pull_policy: build
    environment:
      <<: *aphel-environment
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3001
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    <<: *aphel
    command: ["worker"]
    environment:
      <<: *aphel-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_started

  reset:
    <<: *aphel
    entrypoint: ["/bin/sh", "/demo/daily-reset.sh"]
    command: []
    environment:
      <<: *aphel-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - demo-storage:/app/storage
      - ./daily-reset.sh:/demo/daily-reset.sh:ro
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aphel_demo}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - demo-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  demo-storage:
  demo-mysql:
